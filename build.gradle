plugins {
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'java-gradle-plugin'
    id 'jacoco'
}

configurations {
    xjcTool
}

group = 'name.jurgenei.gradle'
version = '0.1.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation 'org.docx4j:docx4j-core:17.0.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'

    xjcTool 'org.glassfish.jaxb:jaxb-xjc:4.0.5'

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

def generatedJaxbDir = layout.buildDirectory.dir('generated/sources/xjc/main')

tasks.register('generateCanonicalJaxb', JavaExec) {
    group = 'build'
    description = 'Generates JAXB classes from canonical.xsd into a dedicated generated package.'
    classpath = configurations.xjcTool
    mainClass = 'com.sun.tools.xjc.XJCFacade'
    inputs.file(file('src/main/resources/schema/canonical.xsd'))
    outputs.dir(generatedJaxbDir)

    doFirst {
        generatedJaxbDir.get().asFile.mkdirs()
    }

    args(
            '-extension',
            '-no-header',
            '-encoding', 'UTF-8',
            '-d', generatedJaxbDir.get().asFile.absolutePath,
            '-p', 'name.jurgenei.gradle.ooxml.generated.canonical',
            file('src/main/resources/schema/canonical.xsd').absolutePath
    )
}

sourceSets {
    main {
        java.srcDir(generatedJaxbDir)
    }

}

tasks.named('compileJava') {
    dependsOn tasks.named('generateCanonicalJaxb')
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn tasks.named('generateCanonicalJaxb')
}

gradlePlugin {
    website = 'https://github.com/jurgenei/gradle-ooxml-plugin'
    vcsUrl = 'https://github.com/jurgenei/gradle-ooxml-plugin.git'

    plugins {
        ooxmlPlugin {
            id = 'name.jurgenei.gradle.ooxml'
            implementationClass = 'name.jurgenei.gradle.ooxml.OoXmlPlugin'
            displayName = 'OOXML Canonical Plugin'
            description = 'Converts DOCX/PPTX/XLSX to canonical XML and extracts assets.'
            tags = ['ooxml', 'docx4j', 'jaxb', 'docx', 'pptx', 'xlsx', 'xml']
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.withType(Javadoc).configureEach {
    // Generated JAXB sources and data-model POJOs intentionally keep minimal docs.
    options.addStringOption('Xdoclint:none', '-quiet')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
