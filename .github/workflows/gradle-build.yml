name: Build and Test

on:
  push:
    branches: ["main", "master", "release/**"]
  pull_request:
    branches: ["main", "master", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --stacktrace

      - name: Upload coverage reports to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jurgenei/gradle-ooxml-plugin

      - name: Codecov token missing notice
        if: ${{ secrets.CODECOV_TOKEN == '' }}
        run: |
          echo "### Codecov upload skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing repository secret: CODECOV_TOKEN" >> "$GITHUB_STEP_SUMMARY"

