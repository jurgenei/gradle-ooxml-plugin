name: Coverage

on:
  push:
    branches: ["main", "master", "release/**"]
  pull_request:
    branches: ["main", "master", "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure gradle-xml-plugin is available
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          if [ -d "$ROOT_PARENT/gradle-xml-plugin/.git" ]; then
            echo "gradle-xml-plugin already present"
            exit 0
          fi

          if git clone --depth 1 "https://github.com/$OWNER/gradle-xml-plugin.git" "$ROOT_PARENT/gradle-xml-plugin"; then
            echo "Cloned $OWNER/gradle-xml-plugin"
            exit 0
          fi

          git clone --depth 1 "https://github.com/jurgenei/gradle-xml-plugin.git" "$ROOT_PARENT/gradle-xml-plugin"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run tests + JaCoCo coverage
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: Build coverage summary
        id: jacoco
        uses: madrapps/jacoco-report@50d3aff4548aa991e6753342d9ba291084e63848
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          update-comment: false

      - name: Add coverage summary to job output
        run: |
          echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Overall: ${{ steps.jacoco.outputs.coverage-overall }}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed files: ${{ steps.jacoco.outputs.coverage-changed-files }}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/html/

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: jurgenei/gradle-ooxml-plugin
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Codecov token missing notice
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: |
          echo "### Codecov upload skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing repository secret: CODECOV_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Add it in GitHub Settings > Secrets and variables > Actions" >> "$GITHUB_STEP_SUMMARY"

